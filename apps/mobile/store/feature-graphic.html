<!doctype html>
<!--
  Google Play's feature graphic: 1024 × 500, shown at the top of the store page and cropped on
  some screens, so nothing that matters sits near the edges. Rendered to PNG by render.sh.
  The app's own palette (packages/shared/src/design/palette.ts) and font, in its proportions:
  forest green for the ground, sand for the words, the purple only on the name.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Rubik;
        font-weight: 500;
        src: url('../assets/fonts/Rubik-Medium.ttf');
      }
      @font-face {
        font-family: Rubik;
        font-weight: 800;
        src: url('../assets/fonts/Rubik-ExtraBold.ttf');
      }
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
      }
      body {
        font-family: Rubik, sans-serif;
        background:
          radial-gradient(circle at 80% 30%, rgba(227, 201, 148, 0.16) 0, transparent 46%),
          radial-gradient(circle at 15% 85%, rgba(199, 125, 255, 0.12) 0, transparent 42%),
          linear-gradient(135deg, #1e4632 0%, #173123 55%, #102419 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 56px;
        color: #f5ecdc;
      }
      .logo {
        width: 330px;
        height: 330px;
        border-radius: 72px;
        box-shadow:
          0 0 0 2px rgba(227, 201, 148, 0.28),
          0 24px 60px rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .logo img {
        width: 330px;
        height: 330px;
      }
      .words {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 470px;
      }
      .name {
        font-weight: 800;
        font-size: 84px;
        letter-spacing: -1px;
        color: #c77dff;
        direction: ltr;
        text-align: right;
      }
      .tagline {
        font-weight: 800;
        font-size: 38px;
        line-height: 1.2;
      }
      .sub {
        font-weight: 500;
        font-size: 24px;
        color: #c2b396;
      }
    </style>
  </head>
  <body>
    <div class="logo"><img src="../assets/icon.png" alt="" /></div>
    <div class="words">
      <div class="name">JustFit</div>
      <div class="tagline">אימונים, תזונה ומים — הכול במקום אחד</div>
      <div class="sub">יומן אימונים · מאמן AI · מעקב התקדמות</div>
    </div>
  </body>
</html>
