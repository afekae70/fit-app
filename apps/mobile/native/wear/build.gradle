// The NovaFit watch app: a second application module beside :app, in the generated project.
//
// Two things here are not free choices.
//
// The application id is the phone app's. The Wearable Data Layer only delivers messages between
// apps that share a package name AND a signing certificate — a watch app called anything else is
// a stranger to the phone, and every reading is silently dropped. The namespace is different only
// so the two modules' R classes and Kotlin packages do not collide.
//
// The signing config is the phone app's too, the same debug keystore, for the same reason.

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.afeka.fitapp.wear'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.afeka.fitapp'
        // Wear OS 3, which is the first Galaxy Watch that runs it (the Watch 4).
        minSdkVersion 30
        // Android 14. See the note on BODY_SENSORS in the manifest before raising it.
        targetSdkVersion 34
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // The whole dependency list: the channel to the phone. The sensor is plain SensorManager.
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
