name: CI

# Every push and every pull request. Branch pushes matter as much as PRs here: the work on this
# repo lands straight on main from more than one machine, so a check that only ran on PRs would
# never run at all.
on:
  push:
  pull_request:

# A second push to the same branch makes the first run pointless — cancel it rather than pay for
# a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not the repo's declared minimum of 20. The database tests run real SQL against
          # `node:sqlite`, which does not exist before 22.5 — on 20 every one of them fails to
          # import rather than failing an assertion, which reads as a broken checkout.
          node-version: 22
          cache: npm

      # `ci`, not `install`: installs exactly what package-lock.json pins and fails if the
      # lockfile and the manifests disagree, which is a thing worth learning from CI rather than
      # from a machine that happened to resolve differently.
      - name: Install
        run: npm ci

      # The gate CLAUDE.md names before saying anything works, plus lint. Separate steps so a
      # red build says which one broke without opening the log.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Neither of the above loads the app the way Metro does. Bundling is what catches an import
      # that resolves for tsc but not at runtime, and a missing asset — the class of failure that
      # otherwise only shows up on a phone.
      - name: Bundle the app
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"
